name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          files=$(git diff --name-only "$BASE" HEAD)
          echo "server=$(echo "$files" | grep -qv '^web/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$(echo "$files" | grep -qE '^(web|\.github)/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "cli=$(echo "$files" | grep -qE '^(cli|\.github)/' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/server.yml

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  # Runs on the server workflow's build, which every change to cli/ triggers as well
  cli:
    name: CLI
    needs: [changes, server]
    if: needs.changes.outputs.cli == 'true'
    uses: ./.github/workflows/cli.yml

  ci:
    name: CI
    needs: [changes, server, web, cli]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any child failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
